# chrony drop-in for nextcloud-server (192.168.2.44): serve time to the AC scheduler ESP32.
#
# Install: copy to /etc/chrony/conf.d/ (Debian/Ubuntu) and run `sudo systemctl restart chrony`.
# The ESP32 asks the public pool first and this server second (cfg.toml [time] home_ntp).

# Answer NTP clients on the trusted LAN, where the ESP32 lives (routed through the ER-4).
allow 192.168.0.0/24

# Keep serving time from this PC's own clock when the internet (and every upstream source)
# is down, so the ESP32 can still set its clock after a power cut. Stratum 10 means any real
# upstream source is preferred as soon as one is reachable again.
local stratum 10
